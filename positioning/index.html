<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <title>positioning exercise</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="smiley">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
        <div class="nose"></div>
    </div>

    <div class="box">static</div>

    <div class="box relative">relative</div>

    <div class="box">static</div>
    <div class="box">static</div>

    <div class="box sticky">sticky</div>

    <div class="box">static</div>
    <div class="box">static</div>

    <div class="box fixed">fixed</div>

    <div class="box">static</div>
    <div class="box">static</div>

    <div class="box absolute a1">absolute</div>
    <div class="box absolute a2">absolute</div>
    <div class="box absolute a3">absolute</div>

    <div class="box">static</div>
    <div class="box">static</div>
    <div class="box">static</div>
    <div class="box">static</div>
    <div class="box">static</div>
    <div class="box">static</div>

    <div class="parent">
        <div class="child"></div>
        <!-- when a div element is contained inside another div element you're creating a relationship between the two, they become related to each other -->
    </div>

</body>

</html>
